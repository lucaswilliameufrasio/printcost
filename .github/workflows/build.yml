name: Build apps

# - Pull requests: analyze, test and build the APK (kept as a workflow artifact).
# - Push to main: same, then refresh the "dev" pre-release with the new APK,
#   so there is a fixed public download link for testers.
# - Tag v*: publish a numbered pre-release with the APK.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  push-guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pushed commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.githooks/pre-push --range "$BASE_SHA" "$HEAD_SHA"

  versioned-artifact-check:
    # Exercise the tagged APK transfer without creating a tag or release.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: 1.2.3-rc.1+4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create synthetic versioned APK
        run: |
          mkdir -p fixture
          printf 'synthetic artifact for transfer validation\n' > "fixture/printcost-${VERSION}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: printcost-versioned-validation
          path: fixture/*.apk
          if-no-files-found: error
          retention-days: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: printcost-versioned-validation
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error
      - name: Verify versioned transfer
        run: |
          python3 tool/extract_artifact.py artifact-download dist "printcost-${VERSION}.apk"
          cmp "fixture/printcost-${VERSION}.apk" "dist/printcost-${VERSION}.apk"

  check:
    needs: push-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tool/signing-key/go.mod
          cache-dependency-path: tool/signing-key/go.sum
      - name: Signing key tool
        working-directory: tool/signing-key
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Development tools
        run: python3 -m unittest discover -s tool -p 'test_*.py'

  android:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.name }}
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Version
        id: version
        run: |
          base=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
          else
            name="$base-dev.$GITHUB_RUN_NUMBER"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # The same test key on every build, so a new version installs over the
      # previous one. Not the Play Store key. See docs/assinatura-android.md.
      - name: Test signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets: APK signed with a throwaway debug key (updates will not install over it)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/printcost-dev.jks"
          {
            echo "PRINTCOST_KEYSTORE_PATH=$RUNNER_TEMP/printcost-dev.jks"
            echo "PRINTCOST_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRINTCOST_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PRINTCOST_KEY_ALIAS=printcost-dev"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name "${{ steps.version.outputs.name }}" \
            --build-number "$GITHUB_RUN_NUMBER"
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            cp build/app/outputs/flutter-apk/app-release.apk \
              "dist/printcost-${{ steps.version.outputs.name }}.apk"
          else
            cp build/app/outputs/flutter-apk/app-release.apk dist/printcost-dev.apk
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: printcost-android
          path: dist/*.apk
          retention-days: 14

  dev-release:
    # Without the test key an installed build could never be updated: don't
    # publish it.
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.android.outputs.signed == 'true'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.android.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: printcost-android
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error
      - name: Extract verified APK
        run: python3 tool/extract_artifact.py artifact-download dist printcost-dev.apk
      - name: Update the dev pre-release
        run: |
          cat > notes.md <<EOF
          **Versão de teste** ($VERSION), gerada automaticamente a cada mudança
          na \`main\` (commit ${GITHUB_SHA::7}). Pode ter erros e mudar a qualquer
          momento. Não é uma versão final.

          **Como instalar no Android:** abra este link no celular, baixe
          \`printcost-dev.apk\` e permita a instalação quando o Android pedir.
          Versões de teste novas instalam por cima da anterior sem apagar seus
          dados.

          ---

          **Test build** ($VERSION), built automatically on every change to
          \`main\`. It may have bugs. New test builds install over the previous
          one and keep your data.
          EOF
          if gh release view dev >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/dev" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit dev --prerelease --latest=false \
              --title "Versão de teste (dev)" --notes-file notes.md
          else
            gh release create dev --target "$GITHUB_SHA" --prerelease \
              --latest=false --title "Versão de teste (dev)" --notes-file notes.md
          fi
          gh release upload dev dist/printcost-dev.apk --clobber

  tagged-release:
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      needs.android.outputs.signed == 'true'
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        env:
          NODE_OPTIONS: --throw-deprecation
        with:
          name: printcost-android
          path: artifact-download
          skip-decompress: true
          digest-mismatch: error
      - name: Extract verified APK
        env:
          VERSION: ${{ needs.android.outputs.version }}
        run: python3 tool/extract_artifact.py artifact-download dist "printcost-${VERSION}.apk"
      # Numbered versions stay pre-releases until there is a store release.
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk --verify-tag \
            --prerelease --latest=false --generate-notes \
            --title "PrintCost $GITHUB_REF_NAME (teste)"
