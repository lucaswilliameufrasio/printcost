name: Push safety guard

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: push-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate pushed commit range
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '0000000000000000000000000000000000000000' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: ./.githooks/pre-push --range "$BASE_SHA" "$HEAD_SHA"
