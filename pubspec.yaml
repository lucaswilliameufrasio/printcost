name: printcost
description: "PrintCost - calculadora de custo e precificação para impressão 3D (offline)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.8
  cupertino_icons: ^2.0.0
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  mqtt_client: ^10.14.0
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.8.0
  url_launcher: ^6.3.3
  xml: ^7.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.2
  build_runner: ^2.17.1
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true


# dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#00796B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_foreground.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#00796B"
  image: assets/icon/splash.png
  android_12:
    color: "#00796B"
    image: assets/icon/icon_foreground.png
  ios: true
  android: true
